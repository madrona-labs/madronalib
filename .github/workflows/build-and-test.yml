# madronalib build & test pipeline
# Builds the library and runs the test suite on macOS, Linux, and Windows.
#
# Triggers:
#   - push to main, fix/**, or ci/** branches
#   - PRs targeting main
#   - manual dispatch (with build type and per-platform toggles)

name: build and test madronalib

on:
  push:
    branches: [main, 'fix/**', 'ci/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      build-macos:
        description: 'Build for macOS'
        required: false
        default: true
        type: boolean
      build-macos-intel:
        description: 'Build for macOS (Intel / x86_64 — exercises SSE)'
        required: false
        default: true
        type: boolean
      build-linux:
        description: 'Build for Linux'
        required: false
        default: true
        type: boolean
      build-windows:
        description: 'Build for Windows'
        required: false
        default: true
        type: boolean

jobs:
  # Reject commit messages carrying AI-assistant attribution trailers. These are
  # added by default by some tooling and are preserved verbatim by merge commits,
  # so they must be caught before landing rather than scrubbed from history after.
  check-commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject Co-Authored-By trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            head="$PR_HEAD"
            base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          else
            head="$PUSH_AFTER"
            # github.event.before is all-zeros for a new branch, and may point at
            # a discarded commit after a force-push; fall back to the tip alone.
            base="$PUSH_BEFORE"
            if [ -z "${base//0/}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base=""
            fi
          fi

          if [ -n "$base" ]; then
            commits="$(git rev-list "$base..$head")"
          else
            echo "No usable base commit; checking tip commit only."
            commits="$(git rev-list -1 "$head")"
          fi

          failed=0
          for sha in $commits; do
            if git log -1 --format='%B' "$sha" | grep -qiE '^Co-Authored-By:'; then
              subject="$(git log -1 --format='%s' "$sha")"
              echo "::error::$sha has a Co-Authored-By trailer: $subject"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Remove the trailer with:  git commit --amend   (or: git rebase -i <base>)"
            echo "To stop Claude Code adding it, this repo ships .claude/settings.json"
            echo "with an empty attribution byline; make sure your local settings do"
            echo "not override it."
            exit 1
          fi

          echo "No attribution trailers found in $(echo "$commits" | grep -c .) commit(s)."

  test-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build-macos == 'true' }}
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build-type || 'Release' }}
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"
          -DBUILD_EXAMPLES=OFF

      - name: Build tests
        run: cmake --build build --target tests --parallel 4

      - name: Run tests
        run: ./build/bin/tests

  test-macos-intel:
    # Intel macOS runner — exercises the SSE code path natively (the macos-15
    # Apple Silicon runner only executes the arm64/NEON slice of the universal
    # binary).
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build-macos-intel == 'true' }}
    name: macOS (Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build-type || 'Release' }}
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"
          -DBUILD_EXAMPLES=OFF

      - name: Build tests
        run: cmake --build build --target tests --parallel 4

      - name: Run tests
        run: ./build/bin/tests

  test-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build-linux == 'true' }}
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build-type || 'Release' }}
          -DBUILD_EXAMPLES=OFF

      - name: Build tests
        run: cmake --build build --target tests --parallel

      - name: Run tests
        run: ./build/bin/tests

  test-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build-windows == 'true' }}
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build-type || 'Release' }}
          -DBUILD_EXAMPLES=OFF

      - name: Build tests
        run: cmake --build build --target tests --config ${{ github.event.inputs.build-type || 'Release' }} --parallel

      - name: Run tests
        run: .\build\bin\${{ github.event.inputs.build-type || 'Release' }}\tests.exe

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test-macos, test-macos-intel, test-linux, test-windows]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## madronalib Build & Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.test-macos.result == 'success' && '✅ Success' || needs.test-macos.result == 'skipped' && 'Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS (Intel) | ${{ needs.test-macos-intel.result == 'success' && '✅ Success' || needs.test-macos-intel.result == 'skipped' && 'Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | ${{ needs.test-linux.result == 'success' && '✅ Success' || needs.test-linux.result == 'skipped' && 'Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.test-windows.result == 'success' && '✅ Success' || needs.test-windows.result == 'skipped' && 'Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build type:** \`${{ github.event.inputs.build-type || 'Release' }}\`" >> $GITHUB_STEP_SUMMARY
